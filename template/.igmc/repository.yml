schema_version: "1.0"

repository:
  id: "{{REPOSITORY_ID}}"
  name: "{{REPOSITORY_NAME}}"
  archetype: "{{REPOSITORY_ARCHETYPE}}"
  lifecycle: "{{REPOSITORY_LIFECYCLE}}"
  visibility: "{{REPOSITORY_VISIBILITY}}"

standard:
  profile: "igmc-default"
  version: "{{IGMC_STANDARD_VERSION}}"
  last_alignment_check: null
  automatic_checks: true

paths:
  source: []
  tests: []
  documentation: "docs"
  design: "docs/design"
  architecture: "docs/architecture"
  decisions: "docs/decisions"
  plans: "docs/plans"
  reviews: "docs/reviews"

commands:
  setup: null
  validate: "python scripts/validate_artifacts.py"
  test: null
  format_check: null
  lint: null

issues:
  provider: "github"
  schema: "igmc-issue-v1"
  sync_on_open: true
  stale_after_minutes: 15

agents:
  enabled:
    - planner
    - reviewer
    - documentarian
    - issue-planner
    - repository-governor

alignment:
  target_score: 90
  blocking_score: 70
  scan_on_open: true
  quick_scan_interval_minutes: 30
  full_scan_interval_hours: 24

exemptions: []