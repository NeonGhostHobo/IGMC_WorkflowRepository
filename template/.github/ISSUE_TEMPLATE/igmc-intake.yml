name: IGMC Intake
description: Request an IGMC issue or implementation task for Codex or an optional Copilot run.
title: "IGMC: "
labels: ["igmc"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the result you want. Codex can turn this request into tracked
        tickets or work on the issue from a local checkout. Copilot assignment
        is optional; creating this issue does not assign any coding agent.
  - type: textarea
    id: request
    attributes:
      label: Request
      description: Include relevant design documents, desired behavior, and constraints.
      placeholder: |
        Example: Add an in-game FPS counter, with validation and an updated design reference.
    validations:
      required: true
