name: IGMC Optimize (Performance & Code Quality)
description: Target specific performance or quality issues for AI-assisted optimization.
labels: ["igmc", "igmc-optimize"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to scope a targeted optimization run.

        Intended flow:
        - Fill out the form below
        - Assign to Copilot coding agent (OptimizationAgent)
        - Agent reads profiling scope, identifies issues, and implements targeted fixes
        - PR must follow standard IGMC artifact requirements (docs → tickets → code → review → report)

        > **Tip:** Be as specific as possible. The more context you provide, the more precise the optimization.

  - type: dropdown
    id: scope
    attributes:
      label: Optimization scope
      description: What are we targeting?
      options:
        - CPU processes
        - GPU processes / rendering
        - Full codebase sweep
        - Specific feature (describe below)
    validations:
      required: true

  - type: checkboxes
    id: target_areas
    attributes:
      label: Target areas
      description: Select all that apply. The agent will prioritize these categories.
      options:
        - label: "Garbage collection / allocation pressure"
        - label: "Update / FixedUpdate / LateUpdate loops"
        - label: "Race conditions / async / threading issues"
        - label: "Legacy or dead code paths"
        - label: "ms spikes / frame time outliers"
        - label: "Lifecycle churn (unnecessary Instantiate / Destroy / new)"
        - label: "Unnecessary or redundant calculations"
        - label: "Over-engineering / abstraction bloat (AI-generated patterns)"
        - label: "Duplicate or conflicting logic (AI memory-loss artifacts)"
        - label: "Draw calls / batching / GPU overhead"
        - label: "Asset loading / memory footprint"
        - label: "Coroutine / Task / async overhead"

  - type: textarea
    id: target_description
    attributes:
      label: Target description
      description: Describe the specific feature, system, or area to focus on. Include file paths, class names, or method names if known.
      placeholder: |
        e.g.
        - EnemyAI.cs — Update() iterates all enemies every frame, even when the game is paused
        - InventoryManager — rebuilt every frame due to a stale flag that is never cleared
        - General: codebase was assembled across many separate AI sessions and likely has conflicting utility helpers
    validations:
      required: true

  - type: dropdown
    id: profiling_data
    attributes:
      label: Profiling data available?
      description: Do you have Unity Profiler, Deep Profile, or frame-capture data to share?
      options:
        - "No — agent should profile from code reading only"
        - "Yes — pasted in the field below"
        - "Yes — linked or described in Target description"
    validations:
      required: true

  - type: textarea
    id: profiling_notes
    attributes:
      label: Profiling notes / data
      description: Paste profiler output, frame-time data, GC alloc traces, or a screenshot description. Leave blank if none.
      placeholder: |
        e.g.
        - GC.Alloc: 2.4 MB/frame in EnemyManager.UpdateAll()
        - Main thread spike: 8 ms in Physics.Simulate at 60 fps target
        - Deep Profile shows 60% of frame time in string formatting inside UI HUD
    validations:
      required: false

  - type: dropdown
    id: risk_tolerance
    attributes:
      label: Risk tolerance for changes
      description: How aggressive should the optimization be?
      options:
        - "Safe only — no behavior changes, micro-optimizations and caching only"
        - "Moderate — refactor internals, preserve public API surface"
        - "Aggressive — rearchitect if needed, API compatibility not required"
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Anything else the agent should know — recent refactors, known fragile areas, constraints, etc.
      placeholder: "e.g. Do not touch NetworkManager.cs — it is stable and owned by another team."
    validations:
      required: false
