name: IGMC Issue Helper

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  helper:
    name: Comment implementation checklist
    if: contains(github.event.issue.labels.*.name, 'igmc') || startsWith(github.event.issue.title, 'IGMC:')
    runs-on: ubuntu-latest

    steps:
      - name: Comment implementation checklist
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const checklist = `## IGMC issue checklist\n\n` +
              `Codex can work on this issue from the repository in VS Code or the OpenAI desktop app. ` +
              `Use the repository instructions in AGENTS.md and the relevant docs. ` +
              `If issue generation is needed, use the igmc-issues skill and check existing issues first.\n\n` +
              `For implementation, update the required docs and tickets, run the declared validation commands, ` +
              `and include review.md when the PR gate requires it. ` +
              `Assigning GitHub Copilot is an optional alternative.\n`;
            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });
            if (existing.data.some(c => (c.body || '').startsWith('## IGMC issue checklist'))) {
              core.info('IGMC checklist already exists; skipping.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: checklist,
            });
