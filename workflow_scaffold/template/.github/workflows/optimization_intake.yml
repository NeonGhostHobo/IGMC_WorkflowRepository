name: IGMC Optimize Intake (Copilot)

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  helper:
    name: Comment OptimizationAgent checklist
    if: contains(github.event.issue.labels.*.name, 'igmc-optimize')
    runs-on: ubuntu-latest

    steps:
      - name: Comment OptimizationAgent checklist
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body  = issue.body || '';

            // Parse key form fields from the issue body for the checklist comment.
            const scopeMatch       = body.match(/### Optimization scope\s*\n+([^\n]+)/);
            const riskMatch        = body.match(/### Risk tolerance for changes\s*\n+([^\n]+)/);
            const scope            = scopeMatch  ? scopeMatch[1].trim()  : '(not specified)';
            const risk             = riskMatch   ? riskMatch[1].trim()   : '(not specified)';

            const checklist =
              `## IGMC Optimization Run — Copilot Checklist\n\n` +
              `Assign this issue to **Copilot coding agent (OptimizationAgent)** to start the optimization run.\n\n` +
              `**Parsed scope:** ${scope}\n` +
              `**Risk tolerance:** ${risk}\n\n` +
              `---\n\n` +
              `### Required output order (must be present in the PR)\n\n` +
              `1. **Read the issue form** — scope, target areas, profiling data, risk tolerance.\n` +
              `2. **Update required docs first** (always, before any code change):\n` +
              `   - \`docs/context_pack.md\` + \`docs/context_pack.json\`\n` +
              `   - \`docs/goals.md\` + \`docs/goals.json\`\n` +
              `   - \`docs/design.md\` + \`docs/design.json\`\n` +
              `   - \`docs/plan.md\` + \`docs/plan.yaml\`\n` +
              `3. **Add/update \`tickets/*.md\`** for the optimization work.\n` +
              `4. **Perform a code pass** on the stated scope — list every candidate problem with file, line range, and estimated impact (High / Medium / Low) *before* fixing anything.\n` +
              `5. **Run the AI artifact checklist** on every file in scope:\n` +
              `   - Duplicate utilities solving the same problem by different names\n` +
              `   - Conflicting implementations of the same pattern\n` +
              `   - Dead code preserved across AI refactor sessions\n` +
              `   - Overly abstract interfaces with a single implementation (YAGNI)\n` +
              `   - Constants / config duplicated across files\n` +
              `6. **Implement fixes** within the stated risk tolerance — highest impact first.\n` +
              `7. **Run ReviewAgent** and update \`review.md\` with all findings (fixed and deferred).\n` +
              `8. **Add/update report files**:\n` +
              `   - \`reports/${new Date().toISOString().slice(0,10)}-${issue.number}.md\`\n` +
              `   - \`reports/${new Date().toISOString().slice(0,10)}-${issue.number}.json\`\n\n` +
              `---\n\n` +
              `### CI gates\n` +
              `- PR (IGMC Integrity Gate) must pass\n` +
              `- \`scripts/validate_artifacts.py\` must pass\n` +
              `- All code changes must include updated docs + tickets + \`review.md\`\n\n` +
              `### Optimization-specific rules\n` +
              `- **No speculative optimization** — every change must map to an identified problem.\n` +
              `- **Mark \`Needs Verification\`** in \`review.md\` for any fix that alters async/threading behavior, unless risk tolerance is Aggressive.\n` +
              `- **Do not expand scope** beyond what is stated in the issue form without a comment here first.\n\n` +
              `### Workflow tips\n` +
              `- If the PR is behind base (no true conflicts), comment \`/igmc-rebase\` on the PR to attempt an automated rebase.\n` +
              `- Reference: \`.github/copilot-instructions.md\` and \`.github/agents/IGMC_OptimizationAgent.agent.md\``;

            // Avoid duplicate comments if the workflow re-fires on a re-label.
            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });
            if (existing.data.some(c => (c.body || '').startsWith('## IGMC Optimization Run'))) {
              core.info('Optimization checklist comment already exists; skipping.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issue.number,
              body:  checklist,
            });
